<svg width="850" height="240" viewBox="0 0 850 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1f1635" />
    </linearGradient>

    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <style>
      .titulo {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 38px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .subtitulo {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 15px;
        fill: #a3b3bc;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .pauta {
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 1.5;
        fill: none;
      }
      /* Animação das notas flutuando */
      @keyframes flutuar1 {
        0%, 100% { transform: translateY(0px) rotate(-5deg); opacity: 0.7; }
        50% { transform: translateY(-14px) rotate(8deg); opacity: 1; }
      }
      @keyframes flutuar2 {
        0%, 100% { transform: translateY(0px) rotate(6deg); opacity: 0.6; }
        50% { transform: translateY(-18px) rotate(-6deg); opacity: 1; }
      }
      @keyframes flutuar3 {
        0%, 100% { transform: translateY(-4px) rotate(0deg); opacity: 0.8; }
        50% { transform: translateY(-16px) rotate(10deg); opacity: 1; }
      }
      .nota1 { animation: flutuar1 3.2s ease-in-out infinite; fill: url(#goldGrad); }
      .nota2 { animation: flutuar2 4.1s ease-in-out infinite; fill: #58a6ff; }
      .nota3 { animation: flutuar3 3.6s ease-in-out infinite; fill: #bc8cff; }

      /* Animação das teclas do piano tocando */
      @keyframes tocarTecla1 {
        0%, 100% { fill: #f0f6fc; }
        25% { fill: #f6d365; }
      }
      @keyframes tocarTecla2 {
        0%, 100% { fill: #f0f6fc; }
        55% { fill: #58a6ff; }
      }
      @keyframes tocarTecla3 {
        0%, 100% { fill: #f0f6fc; }
        80% { fill: #bc8cff; }
      }
      .tecla-branca { fill: #f0f6fc; stroke: #0d1117; stroke-width: 1.5; rx: 3; }
      .tecla-ativa-1 { animation: tocarTecla1 3s infinite; }
      .tecla-ativa-2 { animation: tocarTecla2 3.5s infinite; }
      .tecla-ativa-3 { animation: tocarTecla3 2.8s infinite; }
      .tecla-preta { fill: #161b22; stroke: #000; stroke-width: 1; rx: 2; }
    </style>
  </defs>

  
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  
  <path class="pauta" d="M 0 55 Q 210 25, 425 55 T 850 55" />
  <path class="pauta" d="M 0 67 Q 210 37, 425 67 T 850 67" />
  <path class="pauta" d="M 0 79 Q 210 49, 425 79 T 850 79" />
  <path class="pauta" d="M 0 91 Q 210 61, 425 91 T 850 91" />
  <path class="pauta" d="M 0 103 Q 210 73, 425 103 T 850 103" />

  
  <text x="70" y="85" font-size="34" class="nota1">𝄞</text>
  <text x="150" y="65" font-size="26" class="nota2">♪</text>
  <text x="640" y="70" font-size="28" class="nota3">♫</text>
  <text x="720" y="95" font-size="30" class="nota1">♩</text>
  <text x="780" y="60" font-size="24" class="nota2">♬</text>

  
  <text x="425" y="102" text-anchor="middle" class="titulo">Bem-vindo, Jansen</text>
  <text x="425" y="130" text-anchor="middle" class="subtitulo">Código • Automação • Harmonia</text>

  
  <g transform="translate(235, 152)">
    
    <rect x="0" y="0" width="26" height="72" class="tecla-branca tecla-ativa-1" />
    <rect x="27" y="0" width="26" height="72" class="tecla-branca" />
    <rect x="54" y="0" width="26" height="72" class="tecla-branca tecla-ativa-2" />
    <rect x="81" y="0" width="26" height="72" class="tecla-branca" />
    <rect x="108" y="0" width="26" height="72" class="tecla-branca tecla-ativa-3" />
    <rect x="135" y="0" width="26" height="72" class="tecla-branca" />
    <rect x="162" y="0" width="26" height="72" class="tecla-branca" />
    <rect x="189" y="0" width="26" height="72" class="tecla-branca tecla-ativa-2" />
    <rect x="216" y="0" width="26" height="72" class="tecla-branca" />
    <rect x="243" y="0" width="26" height="72" class="tecla-branca tecla-ativa-1" />
    <rect x="270" y="0" width="26" height="72" class="tecla-branca" />
    <rect x="297" y="0" width="26" height="72" class="tecla-branca tecla-ativa-3" />
    <rect x="324" y="0" width="26" height="72" class="tecla-branca" />
    <rect x="351" y="0" width="26" height="72" class="tecla-branca" />

    
    <rect x="18" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="45" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="99" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="126" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="153" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="207" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="234" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="288" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="315" y="0" width="16" height="44" class="tecla-preta" />
    <rect x="342" y="0" width="16" height="44" class="tecla-preta" />
  </g>
</svg>
