<svg width="850" height="260" viewBox="0 0 850 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#170b29" />
    </linearGradient>

    
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .titulo {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .subtitulo {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #00f3ff;
        letter-spacing: 2.5px;
        text-transform: uppercase;
      }
      .pauta {
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 1.5;
        fill: none;
      }

      /* Cores Fluorescentes */
      .neon-azul {
        fill: #00f3ff;
        filter: url(#neonGlow);
      }
      .neon-amarelo {
        fill: #fff01f;
        filter: url(#neonGlow);
      }
      .neon-vermelho {
        fill: #ff1e56;
        filter: url(#neonGlow);
      }

      /* Animações das notas flutuando */
      @keyframes flutuar1 {
        0%, 100% { transform: translateY(0px) rotate(-6deg); opacity: 0.85; }
        50% { transform: translateY(-16px) rotate(8deg); opacity: 1; }
      }
      @keyframes flutuar2 {
        0%, 100% { transform: translateY(-3px) rotate(6deg); opacity: 0.8; }
        50% { transform: translateY(-20px) rotate(-8deg); opacity: 1; }
      }
      @keyframes flutuar3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.85; }
        50% { transform: translateY(-14px) rotate(10deg); opacity: 1; }
      }

      .anim1 { animation: flutuar1 3s ease-in-out infinite; }
      .anim2 { animation: flutuar2 3.7s ease-in-out infinite; }
      .anim3 { animation: flutuar3 3.3s ease-in-out infinite; }

      /* Animação sutil nos ícones de logística */
      @keyframes pulsoLogistica {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .modal-box {
        fill: rgba(255, 255, 255, 0.04);
        stroke: rgba(0, 243, 255, 0.35);
        stroke-width: 1.2;
        rx: 12;
      }
      .modal-label {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #cbd5e1;
        letter-spacing: 1px;
      }
      .log1 { animation: pulsoLogistica 3.2s ease-in-out infinite; }
      .log2 { animation: pulsoLogistica 3.2s ease-in-out 0.4s infinite; }
      .log3 { animation: pulsoLogistica 3.2s ease-in-out 0.8s infinite; }
      .log4 { animation: pulsoLogistica 3.2s ease-in-out 1.2s infinite; }
    </style>
  </defs>

  
  <rect width="850" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  
  <path class="pauta" d="M 0 48 Q 210 18, 425 48 T 850 48" />
  <path class="pauta" d="M 0 60 Q 210 30, 425 60 T 850 60" />
  <path class="pauta" d="M 0 72 Q 210 42, 425 72 T 850 72" />
  <path class="pauta" d="M 0 84 Q 210 54, 425 84 T 850 84" />
  <path class="pauta" d="M 0 96 Q 210 66, 425 96 T 850 96" />

  
  <text x="55" y="78" font-size="32" class="neon-azul anim1">𝄞</text>
  <text x="115" y="54" font-size="25" class="neon-amarelo anim2">♪</text>
  <text x="170" y="88" font-size="28" class="neon-vermelho anim3">♫</text>

  
  <text x="655" y="62" font-size="28" class="neon-vermelho anim1">♩</text>
  <text x="705" y="88" font-size="30" class="neon-azul anim2">♬</text>
  <text x="755" y="54" font-size="26" class="neon-amarelo anim3">♪</text>
  <text x="795" y="82" font-size="32" class="neon-vermelho anim1">𝄞</text>

  
  <text x="425" y="82" text-anchor="middle" class="titulo">Bem-vindo, Jansen</text>
  <text x="425" y="110" text-anchor="middle" class="subtitulo">Logística • Automação • Harmonia</text>

  
  <line x1="90" y1="130" x2="760" y2="130" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  
  <g transform="translate(80, 146)">
    
    <g transform="translate(0, 0)" class="log1">
      <rect x="0" y="0" width="130" height="84" class="modal-box" />
      <text x="65" y="43" font-size="34" text-anchor="middle">🚢</text>
      <text x="65" y="69" text-anchor="middle" class="modal-label">MARÍTIMO</text>
    </g>

    
    <g transform="translate(186, 0)" class="log2">
      <rect x="0" y="0" width="130" height="84" class="modal-box" />
      <text x="65" y="43" font-size="34" text-anchor="middle">🚆</text>
      <text x="65" y="69" text-anchor="middle" class="modal-label">FERROVIÁRIO</text>
    </g>

    
    <g transform="translate(373, 0)" class="log3">
      <rect x="0" y="0" width="130" height="84" class="modal-box" />
      <text x="65" y="43" font-size="34" text-anchor="middle">🚛</text>
      <text x="65" y="69" text-anchor="middle" class="modal-label">RODOVIÁRIO</text>
    </g>

    
    <g transform="translate(560, 0)" class="log4">
      <rect x="0" y="0" width="130" height="84" class="modal-box" />
      <text x="65" y="43" font-size="34" text-anchor="middle">✈️</text>
      <text x="65" y="69" text-anchor="middle" class="modal-label">AÉREO</text>
    </g>
  </g>
</svg>
