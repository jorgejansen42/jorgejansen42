<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#170b29" />
    </linearGradient>

    
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .titulo {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .subtitulo {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #00f3ff;
        letter-spacing: 2.5px;
        text-transform: uppercase;
      }
      .pauta {
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 1.5;
        fill: none;
      }

      /* Cores Fluorescentes */
      .neon-azul {
        fill: #00f3ff;
        filter: url(#neonGlow);
      }
      .neon-amarelo {
        fill: #fff01f;
        filter: url(#neonGlow);
      }
      .neon-vermelho {
        fill: #ff1e56;
        filter: url(#neonGlow);
      }

      /* Animações das notas flutuando */
      @keyframes flutuar1 {
        0%, 100% { transform: translateY(0px) rotate(-6deg); opacity: 0.85; }
        50% { transform: translateY(-16px) rotate(8deg); opacity: 1; }
      }
      @keyframes flutuar2 {
        0%, 100% { transform: translateY(-3px) rotate(6deg); opacity: 0.8; }
        50% { transform: translateY(-20px) rotate(-8deg); opacity: 1; }
      }
      @keyframes flutuar3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.85; }
        50% { transform: translateY(-14px) rotate(10deg); opacity: 1; }
      }

      .anim1 { animation: flutuar1 3s ease-in-out infinite; }
      .anim2 { animation: flutuar2 3.7s ease-in-out infinite; }
      .anim3 { animation: flutuar3 3.3s ease-in-out infinite; }

      /* Animações dos veículos indo de um lado para o outro */
      @keyframes moverDireitaEsquerda {
        0%, 100% { transform: translateX(-18px); }
        50% { transform: translateX(18px); }
      }
      @keyframes moverEsquerdaDireita {
        0%, 100% { transform: translateX(18px); }
        50% { transform: translateX(-18px); }
      }

      .veiculo-ida { animation: moverDireitaEsquerda 3.2s ease-in-out infinite; }
      .veiculo-volta { animation: moverEsquerdaDireita 3.6s ease-in-out infinite; }

      .modal-card {
        fill: rgba(255, 255, 255, 0.03);
        stroke: rgba(0, 243, 255, 0.35);
        stroke-width: 1.5;
        rx: 12;
      }
      .modal-label {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #cbd5e1;
        letter-spacing: 1.2px;
      }
      .trilho {
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
      }
    </style>
  </defs>

  
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  
  <path class="pauta" d="M 0 48 Q 225 18, 450 48 T 900 48" />
  <path class="pauta" d="M 0 60 Q 225 30, 450 60 T 900 60" />
  <path class="pauta" d="M 0 72 Q 225 42, 450 72 T 900 72" />
  <path class="pauta" d="M 0 84 Q 225 54, 450 84 T 900 84" />
  <path class="pauta" d="M 0 96 Q 225 66, 450 96 T 900 96" />

  
  <text x="55" y="78" font-size="32" class="neon-azul anim1">𝄞</text>
  <text x="115" y="54" font-size="25" class="neon-amarelo anim2">♪</text>
  <text x="175" y="88" font-size="28" class="neon-vermelho anim3">♫</text>

  
  <text x="695" y="62" font-size="28" class="neon-vermelho anim1">♩</text>
  <text x="745" y="88" font-size="30" class="neon-azul anim2">♬</text>
  <text x="795" y="54" font-size="26" class="neon-amarelo anim3">♪</text>
  <text x="835" y="82" font-size="32" class="neon-vermelho anim1">𝄞</text>

  
  <text x="450" y="82" text-anchor="middle" class="titulo">Bem-vindo, Jansen</text>
  <text x="450" y="110" text-anchor="middle" class="subtitulo">Logística • Automação • Harmonia</text>

  
  <line x1="60" y1="132" x2="840" y2="132" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  

  
  <g transform="translate(45, 150)">
    <rect x="0" y="0" width="175" height="104" class="modal-card" />
    <line x1="20" y1="66" x2="155" y2="66" class="trilho" />
    
    <g class="veiculo-ida">
      <g transform="translate(57, 22)">
        
        <polygon points="4,30 56,30 48,42 12,42" fill="#00f3ff" />
        
        <rect x="14" y="20" width="12" height="9" fill="#ff1e56" />
        <rect x="28" y="20" width="12" height="9" fill="#fff01f" />
        <rect x="20" y="11" width="14" height="8" fill="#cbd5e1" />
        
        <rect x="42" y="14" width="6" height="15" fill="#94a3b8" />
      </g>
    </g>
    <text x="87.5" y="90" text-anchor="middle" class="modal-label">MARÍTIMO</text>
  </g>

  
  <g transform="translate(256, 150)">
    <rect x="0" y="0" width="175" height="104" class="modal-card" />
    <line x1="20" y1="66" x2="155" y2="66" class="trilho" />
    
    <g class="veiculo-volta">
      <g transform="translate(52, 22)">
        
        <rect x="6" y="14" width="58" height="22" rx="4" fill="#fff01f" />
        <rect x="46" y="18" width="12" height="8" rx="1" fill="#0d1326" />
        <rect x="12" y="18" width="10" height="8" rx="1" fill="#0d1326" />
        <rect x="26" y="18" width="10" height="8" rx="1" fill="#0d1326" />
        
        <circle cx="64" cy="30" r="2.5" fill="#ff1e56" />
        
        <circle cx="16" cy="39" r="4" fill="#00f3ff" />
        <circle cx="35" cy="39" r="4" fill="#00f3ff" />
        <circle cx="54" cy="39" r="4" fill="#00f3ff" />
      </g>
    </g>
    <text x="87.5" y="90" text-anchor="middle" class="modal-label">FERROVIÁRIO</text>
  </g>

  
  <g transform="translate(468, 150)">
    <rect x="0" y="0" width="175" height="104" class="modal-card" />
    <line x1="20" y1="66" x2="155" y2="66" class="trilho" />
    
    <g class="veiculo-ida">
      <g transform="translate(52, 22)">
        
        <rect x="4" y="12" width="42" height="24" rx="2" fill="#00f3ff" />
        
        <path d="M 48 18 L 62 18 L 66 26 L 66 36 L 48 36 Z" fill="#ff1e56" />
        
        <polygon points="51,21 60,21 63,26 51,26" fill="#0d1326" />
        
        <circle cx="15" cy="39" r="4.5" fill="#fff01f" />
        <circle cx="36" cy="39" r="4.5" fill="#fff01f" />
        <circle cx="57" cy="39" r="4.5" fill="#fff01f" />
      </g>
    </g>
    <text x="87.5" y="90" text-anchor="middle" class="modal-label">RODOVIÁRIO</text>
  </g>

  
  <g transform="translate(680, 150)">
    <rect x="0" y="0" width="175" height="104" class="modal-card" />
    <line x1="20" y1="66" x2="155" y2="66" class="trilho" />
    
    <g class="veiculo-volta">
      <g transform="translate(54, 20)">
        
        <path d="M 6 24 L 54 24 Q 64 24 66 27 Q 64 30 54 30 L 12 30 L 4 16 L 10 16 L 16 24 Z" fill="#ff1e56" />
        
        <polygon points="28,24 42,24 32,12 24,12" fill="#00f3ff" />
        <polygon points="28,30 42,30 32,40 24,40" fill="#fff01f" />
      </g>
    </g>
    <text x="87.5" y="90" text-anchor="middle" class="modal-label">AÉREO</text>
  </g>
</svg>
